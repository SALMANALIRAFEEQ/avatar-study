<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f8f7f3">
  <title>AI Avatar Study</title>
  <link rel="icon" href="data:,">
  <!-- The one allowed Google Font, headings only. display=swap: Georgia shows until it loads. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <span class="masthead-title" id="brand-name">AI Avatar Study</span>
    </div>
    <div class="progress" role="progressbar" aria-label="Study progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="boot-loading"><span class="spinner" aria-hidden="true"></span> Loading…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="debug-panel" class="debug-panel" hidden></div>

  <noscript>
    <p class="container">This study needs JavaScript. Please enable it or open the link in Chrome.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
