<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f1fb">
  <title>Avatar Video Study</title>
  <link rel="icon" href="data:,">
  <!-- The one allowed Google Font. display=swap: text shows in the system font until it loads. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>
        </span>
        <span class="brand-name" id="brand-name">Avatar Video Study</span>
      </span>
      <span class="step-label" id="step-label"></span>
    </div>
    <div class="progress" role="progressbar" aria-label="Study progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <div class="boot-loading"><span class="spinner spinner-inline" aria-hidden="true"></span><p>Loading…</p></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="debug-panel" class="debug-panel" hidden></div>

  <noscript>
    <p class="container">This study needs JavaScript. Please enable it or open the link in Chrome.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
